name: flutter_bloc_template
description: "Flutter BLoC template"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.2
  dio: ^5.9.2
  equatable: ^2.0.5
  flex_color_scheme: ^8.4.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  fpdart: ^1.1.0
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^17.1.0
  intl: ^0.20.2
  lottie: ^3.1.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  share_plus: ^12.0.1
  url_launcher: ^6.2.6
  uuid: ^4.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: any
  change_app_package_name: ^1.1.0
  flutter_lints: ^6.0.0
  build_runner: any
  flutter_native_splash: ^2.3.9
  flutter_gen_runner:


flutter_icons:
  image_path: "assets/images/logo.png"
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21


flutter_gen:
  output: lib/core/const/ # Optional (default: lib/const/)
  line_length: 120 # Optional (default: 80)


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - .env

